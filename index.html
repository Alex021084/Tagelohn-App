<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a84ff"><link rel="manifest" href="manifest.json"><title>Tagelohnnachweis</title>
<link rel="stylesheet" href="styles.css"></head><body>
<header><div><small>Baustelle</small><h1>Tagelohnnachweis</h1></div><button id="new">＋</button></header>
<main>
<section id="home" class="screen active"><button id="new2" class="primary big">＋ Neuer Tagelohnnachweis</button>
<div class="cards"><button class="card" id="archiveBtn">📄 <span><b>Meine Nachweise</b><small id="count">0 Nachweise</small></span>›</button>
<button class="card" onclick="alert('Stammdaten können im nächsten Ausbau ergänzt werden.')">🏗️ <span><b>Stammdaten</b><small>Auftraggeber, Baustellen, Mitarbeiter</small></span>›</button></div></section>
<section id="editor" class="screen">
<div class="steps">1 Kopf · 2 Mitarbeiter · 3 Arbeiten · 4 Unterschrift · 5 PDF</div>
<div class="panel"><h2>Kopfdaten</h2>
<label>Datum<input id="date" type="date"></label><label>Auftraggeber<input id="contractor"></label>
<label>Anschrift<textarea id="address"></textarea></label><label>Bauvorhaben<textarea id="project"></textarea></label></div>
<div class="panel"><div class="title"><h2>Mitarbeiter / Leistungen</h2><button id="addEmp">＋ Hinzufügen</button></div><div id="employees"></div></div>
<div class="panel"><h2>Ausgeführte Arbeiten</h2><div id="works"></div><button id="addWork">＋ Eintrag hinzufügen</button></div>
<div class="panel"><h2>Material / sonstige Leistungen</h2><div id="materials"></div><button id="addMat">＋ Eintrag hinzufügen</button></div>
<div class="panel"><h2>Unterschrift Auftraggeber</h2><canvas id="sig" width="900" height="360"></canvas><div class="row"><button id="clear">Unterschrift löschen</button><input id="client" placeholder="Name (optional)"></div></div>
<div class="actions"><button id="save" class="primary">Nachweis speichern</button><button id="pdf" class="primary">PDF erstellen</button></div>
</section>
<section id="archive" class="screen"><div class="title"><h2>Meine Nachweise</h2><button id="homeBtn">Zurück</button></div><div id="list"></div></section>
</main>
<nav><button data-s="home">⌂<small>Start</small></button><button data-s="archive">▤<small>Nachweise</small></button><button data-s="editor">＋<small>Neu</small></button></nav>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="app.js"></script></body></html>
